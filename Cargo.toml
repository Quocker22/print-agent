[package]
name = "print-agent"
version = "0.1.0"
edition = "2021"
description = "Agent in hoá đơn: nhận job từ ZaloCRM qua socket.io, in qua driver Windows"
license = "AGPL-3.0-or-later"

[[bin]]
name = "print-agent"
path = "src/main.rs"

[dependencies]
rust_socketio = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
anyhow = "1"
# UI (Slint) — cửa sổ cấu hình + trạng thái, kiểu Tailscale. Thay egui/eframe.
slint = "1.8"
# Tray icon (khay hệ thống) — icon xanh/đỏ theo trạng thái nối, menu phải chuột.
tray-icon = "0.24"
# Dựng icon tray từ buffer RGBA — image chỉ dùng để build ảnh vuông đơn giản,
# tắt hết feature ảnh không cần (không đọc file ảnh nào) cho gọn build.
image = { version = "0.25", default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }

[build-dependencies]
slint-build = "1.8"

[dev-dependencies]
