[package]
name = "print-agent"
version = "0.2.7"
edition = "2021"
description = "Agent in hoá đơn: nhận job từ ZaloCRM qua socket.io, in qua driver Windows"
license = "AGPL-3.0-or-later"

[[bin]]
name = "print-agent"
path = "src/main.rs"

[dependencies]
rust_socketio = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
anyhow = "1"
# UI (Slint) — cửa sổ cấu hình + trạng thái, kiểu Tailscale. Thay egui/eframe.
# raw-window-handle-06: cần để lấy HWND thật (Window::window_handle()) rồi gọi
# taskbar_win::an_khoi_taskbar — Slint không có API ẩn taskbar sẵn (xem
# taskbar_win.rs), phải xuống Win32 qua raw-window-handle. Không tắt default
# features (renderer-software/backend-default đã bật sẵn theo mặc định crate).
slint = { version = "1.8", features = ["raw-window-handle-06"] }
# Cần trực tiếp (không chỉ qua feature slint) để `use raw_window_handle::HasWindowHandle`
# resolve được — bài học từ slint-ui/slint#5319 (feature bật ở slint không đủ,
# IDE/compiler cần crate này khai trực tiếp trong Cargo.toml của binary).
raw-window-handle = "0.6"
# Tray icon (khay hệ thống) — icon xanh/đỏ theo trạng thái nối, menu phải chuột.
tray-icon = "0.24"
# Dựng icon tray từ buffer RGBA — image chỉ dùng để build ảnh vuông đơn giản,
# tắt hết feature ảnh không cần (không đọc file ảnh nào) cho gọn build.
image = { version = "0.25", default-features = false }

[target.'cfg(windows)'.dependencies]
# Win32_Graphics_Printing: poll spooler (EnumJobs/GetPrinter) để xác nhận in
# thật — xem src/spooler.rs. JOB_INFO_2W/PRINTER_INFO_2W (windows 0.58) cần
# CẢ Win32_Graphics_Gdi (field pDevMode) LẪN Win32_Security (pSecurityDescriptor)
# để struct được định nghĩa (đã tra thẳng nguồn crate cục bộ, không đoán).
# winreg: ghi HKCU\...\Run cho "tự khởi động cùng Windows" (src/tu_khoi_dong.rs).
# Máy HCM im 3 ngày 15-18/09 chỉ vì không ai bật lại app sau khi tắt máy.
# Win32_System_SystemInformation: GetLocalTime — giờ máy shop cho cột giờ ở
# "In gần đây" (net.rs::gio_hien_tai); không thêm crate ngày giờ chỉ vì 1 chỗ.
# Win32_System_Threading: CreateMutexW — một máy một bản app (src/mot_ban.rs).
# Win32_Storage_FileSystem + Win32_System_IO: CreateFileW/DeviceIoControl — hỏi
# thẳng máy in USB "đang lỗi / đang in / rảnh" (src/usb_may_in.rs). Máy HP Laser
# 107 ở HCM hết giấy mà Windows vẫn báo rảnh (25/09).
# Win32_System_Power: power request giữ máy tính không tự ngủ khi app chạy
# (src/giu_thuc.rs, 0.2.7 — "máy sleep thì mất kết nối luôn").
# Win32_Devices_DeviceAndDriverInstallation: SetupAPI — danh sách máy in USB đang
# cắm; tài khoản thường KHÔNG đọc được khoá registry DeviceClasses (đo HCM 25/09).
winreg = "0.52"
windows = { version = "0.58", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_Graphics_Printing",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_System_Power",
] }

[build-dependencies]
slint-build = "1.8"

[dev-dependencies]
