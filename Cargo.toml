[package]
name = "print-agent"
version = "0.1.0"
edition = "2021"
description = "Agent in hoá đơn: nhận job từ ZaloCRM qua socket.io, in qua driver Windows"
license = "AGPL-3.0-or-later"

[[bin]]
name = "print-agent"
path = "src/main.rs"

[dependencies]
rust_socketio = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
anyhow = "1"

[dev-dependencies]
